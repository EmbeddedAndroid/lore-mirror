name: lore-mirror
x-image: &image
  image: lore-mirror:local
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 128
  stop_grace_period: 45s
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=512m,uid=10001,gid=10001,mode=1770
    - /runtime:rw,nosuid,noexec,size=128m,uid=10001,gid=10001,mode=0700
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *image
    build:
      context: .
    command: [serve, --config, /config/pilot.json, --listen, "0.0.0.0", --port, "8765"]
    volumes:
      - type: bind
        source: ${LORE_CONFIG:-./config/container.json}
        target: /config/pilot.json
        read_only: true
        bind:
          create_host_path: false
      - mail:/data:ro
      - issues:/issues:rw
    networks: [query]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
  gateway:
    <<: *image
    entrypoint: [socat]
    command: ["TCP-LISTEN:8765,reuseaddr,fork", "TCP:api:8765"]
    ports:
      - "127.0.0.1:${LORE_PORT:-8765}:8765"
    networks: [query, ingress]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
  sync:
    <<: *image
    command: [sync, --config, /config/pilot.json, --daemon]
    volumes:
      - type: bind
        source: ${LORE_CONFIG:-./config/container.json}
        target: /config/pilot.json
        read_only: true
        bind:
          create_host_path: false
      - mail:/data:rw
    networks: [upstream]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, /app/scripts/healthcheck.py, sync, /config/pilot.json]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 4g
    cpus: 2
  test:
    <<: *image
    profiles: [test]
    # Subprocess tests execute temporary scripts; production tmpfs stays noexec.
    tmpfs:
      - /tmp:rw,nosuid,exec,size=512m,uid=10001,gid=10001,mode=1770
      - /runtime:rw,nosuid,noexec,size=128m,uid=10001,gid=10001,mode=0700
    entrypoint: [python]
    command: [-m, unittest, discover, -s, tests, -v]
    environment:
      LORE_NATIVE_E2E_REQUIRED: "1"
    network_mode: none
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 2g
    cpus: 2

networks:
  query:
    internal: true
  upstream: {}
  ingress: {}
volumes:
  mail: {}
  issues: {}
